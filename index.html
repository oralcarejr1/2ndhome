<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>2ndhome 인테리어 플래너</title>
    <meta name="description" content="이사 갈 집 3D 인테리어 플래너 — 실제 가구 치수 배치, 버전 비교, 무드보드, 인체치수 체크" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23181a1e'/%3E%3Cpath d='M7 16 16 8l9 8v9H7z' fill='none' stroke='%23f2f1ee' stroke-width='2.4' stroke-linejoin='round'/%3E%3Crect x='13' y='18' width='6' height='7' fill='%234d8dff'/%3E%3C/svg%3E" />
    <script>
      try {
        var t = localStorage.getItem('2ndhome:theme');
        document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
